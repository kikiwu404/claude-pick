<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Kiki Daily — Music Archive</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <span class="badge">✺ The Kiki Daily ✺</span>
      <h1>Claude's Pick</h1>
      <p class="sub">one non-pop pick a day, based on my taste, picked by Claude AI</p>
    </header>

    <main>
      <div id="filter-bar" class="filter-bar" hidden>
        <span>Showing <strong id="filter-tag"></strong></span>
        <button type="button" id="filter-clear" class="filter-clear">✕ Show all</button>
      </div>
      <div id="grid" class="grid"></div>
      <p id="empty-msg" class="empty" style="display:none;">No entries yet — check back soon.</p>
    </main>

    <footer class="site-footer">
      The Kiki Daily · Music Archive
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
